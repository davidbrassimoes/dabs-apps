<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fita-cola — cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700&amp;family=Chivo+Mono:wght@400;600&amp;family=Permanent+Marker&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.ground}}; color: {{c.text}}; font-family: 'Chivo', system-ui, sans-serif; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px">
    <h1 style="margin: 0; font-family: 'Permanent Marker', cursive; font-weight: 400; font-size: 28px">Cards <span style="font-family: 'Chivo Mono', monospace; font-size: 13px; color: {{c.dim}}">32</span></h1>
    <a href="#new" style="text-decoration: none; display: flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 6px; background: {{c.button}}; color: {{c.buttonInk}}; font-family: 'Chivo Mono', monospace; font-weight: 600; font-size: 13px; letter-spacing: 0.06em">+ NEW</a>
  </header>

  <div style="padding: 8px 16px 0">
    <label for="search-b" style="position: absolute; left: -9999px">Search cards</label>
    <input id="search-b" type="search" placeholder="search…" style="width: 100%; box-sizing: border-box; height: 44px; border: 1px solid {{c.line}}; border-radius: 6px; background: {{c.panel}}; color: {{c.text}}; padding: 0 14px; font-family: 'Chivo Mono', monospace; font-size: 14px">
  </div>

  <div style="display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto">
    <sc-for list="{{chips}}" as="k" hint-placeholder-count="5">
      <button aria-pressed="{{k.on}}" style="flex: none; height: 36px; padding: 0 12px; border-radius: 4px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.fg}}; font-family: 'Chivo Mono', monospace; font-size: 12px; letter-spacing: 0.06em">{{k.label}}</button>
    </sc-for>
  </div>

  <ul style="list-style: none; margin: 0; padding: 0 16px; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <li style="border-bottom: 1px solid {{c.line}}">
        <a href="#edit" style="text-decoration: none; display: flex; gap: 12px; padding: 12px 0">
          <span style="flex: none; width: 10px; align-self: stretch; background: {{r.tab}}"></span>
          <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
            <span style="display: flex; justify-content: space-between; font-family: 'Chivo Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: {{c.dim}}"><span>{{r.kinds}}</span><span>{{r.drawn}}</span></span>
            <span style="font-size: 15px; line-height: 21px; font-weight: 500">{{r.text}}</span>
            <span style="font-family: 'Chivo Mono', monospace; font-size: 11px; color: {{c.dim}}">{{r.gear}}</span>
          </span>
        </a>
      </li>
    </sc-for>
  </ul>

  <nav aria-label="Sections" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid {{c.line}}; background: {{c.panel}}">
    <a href="#draw" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-family: 'Chivo Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: {{c.dim}}">DRAW</a>
    <a href="#cards" aria-current="page" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-family: 'Chivo Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: {{c.text}}">CARDS</a>
    <a href="#gear" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-family: 'Chivo Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: {{c.dim}}">GEAR</a>
    <a href="#import" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-family: 'Chivo Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: {{c.dim}}">IMPORT</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = {
      ground: '#101112', panel: '#1A1C1E', line: '#2F3337',
      text: '#ECECE8', dim: '#A6AAAE', button: '#F2B84B', buttonInk: '#17130A'
    };
    const light = {
      ground: '#E4E4DF', panel: '#F2F2EE', line: '#C3C4BE',
      text: '#151618', dim: '#4C4F53', button: '#F2B84B', buttonInk: '#17130A'
    };
    const c = (this.props.theme ?? 'light') === 'dark' ? dark : light;
    const tab = { idea: '#D9CEB0', source: '#86C9A6', treatment: '#F2B84B', technique: '#9DB3F0', constraint: '#F08A70', arrangement: '#CDA9E6' };
    const chip = (label, on) => ({
      label, on: on ? 'true' : 'false',
      bg: on ? c.text : c.panel, fg: on ? c.ground : c.dim, border: on ? c.text : c.line
    });
    const row = (kind, kinds, text, gear, drawn) => ({ tab: tab[kind], kinds, text, gear, drawn });
    return {
      c,
      chips: [chip('ALL', true), chip('SOURCE', false), chip('TREATMENT', false), chip('CONSTRAINT', false), chip('★', false), chip('MINE', false)],
      rows: [
        row('constraint', 'CONSTRAINT', 'Nothing quantised.', '—', 'NEVER'),
        row('source', 'SOURCE · TECHNIQUE', 'Melodica, into a microphone — never a DI.', 'melodica  xm8500', 'NEVER'),
        row('treatment', 'TREATMENT', 'Hall of Fame 2 before the amp, not after.', 'hall-of-fame-2  ac30', '1×'),
        row('idea', 'IDEA · TECHNIQUE', 'Play the ocarina and the melodica at the same time, one in each hand, into the CM25.', 'ocarina  melodica  cm25', '2×'),
        row('source', 'SOURCE', 'Kalimba, close-miked, one metre off the slab.', 'kalimba  cm25', '3×'),
        row('arrangement', 'ARRANGEMENT', 'Build the whole thing from one bar.', '—', '4×')
      ]
    };
  }
}
</script>
</body>
</html>
