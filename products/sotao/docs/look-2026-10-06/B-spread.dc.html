<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fita-cola — draw three</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700&amp;family=Chivo+Mono:wght@400;600&amp;family=Permanent+Marker&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.ground}}; color: {{c.text}}; font-family: 'Chivo', system-ui, sans-serif; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px">
    <span style="font-family: 'Permanent Marker', cursive; font-size: 24px">Sótão</span>
    <a href="#gear" style="text-decoration: none; display: flex; align-items: center; gap: 8px; font-family: 'Chivo Mono', monospace; font-size: 12px; color: {{c.dim}}; padding: 10px 0">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.led}}"></span>RACK 18/42
    </a>
  </header>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 8px 16px 0">
    <a href="#single" style="text-decoration: none; text-align: center; height: 44px; line-height: 44px; border-radius: 6px; background: {{c.panel}}; border: 1px solid {{c.line}}; color: {{c.dim}}; font-family: 'Chivo Mono', monospace; font-size: 13px; letter-spacing: 0.08em">ONE</a>
    <a href="#spread" aria-current="page" style="text-decoration: none; text-align: center; height: 44px; line-height: 44px; border-radius: 6px; background: {{c.panel}}; border: 1px solid {{c.text}}; font-family: 'Chivo Mono', monospace; font-weight: 600; font-size: 13px; letter-spacing: 0.08em">THREE</a>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 12px 10px">
    <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 12px">
          <span style="transform: rotate({{s.tilt}}); background: {{s.tab}}; color: {{c.tapeInk}}; font-family: 'Chivo Mono', monospace; font-weight: 600; font-size: 12px; letter-spacing: 0.12em; padding: 5px 12px">{{s.kind}}</span>
          <button aria-label="{{s.lockLabel}}" aria-pressed="{{s.lockedAttr}}" style="height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid {{s.lockBorder}}; background: {{c.panel}}; color: {{s.lockColor}}; font-family: 'Chivo Mono', monospace; font-size: 12px; letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>{{s.lockText}}
          </button>
        </div>
        <article style="transform: rotate({{s.cardTilt}}); background: {{c.tape}}; color: {{c.marker}}; padding: 16px 20px 18px; clip-path: polygon(0 4%, 3% 0, 97% 3%, 100% 0, 99% 50%, 100% 96%, 96% 100%, 3% 97%, 0 100%, 1% 50%)">
          <p style="margin: 0; font-family: 'Permanent Marker', cursive; font-size: 22px; line-height: 29px">{{s.text}}</p>
        </article>
      </div>
    </sc-for>
  </div>

  <div style="padding: 0 16px 14px; display: flex; gap: 8px">
    <button aria-label="Previous draw" style="width: 56px; height: 80px; border-radius: 8px; border: 1px solid {{c.line}}; background: {{c.panel}}; color: {{c.dim}}; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <button style="flex-grow: 1; height: 80px; border: 0; border-radius: 8px; background: {{c.button}}; color: {{c.buttonInk}}; font-family: 'Permanent Marker', cursive; font-size: 28px; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.22)">Draw two</button>
  </div>

  <nav aria-label="Sections" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid {{c.line}}; background: {{c.panel}}">
    <a href="#draw" aria-current="page" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-family: 'Chivo Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: {{c.text}}">DRAW</a>
    <a href="#cards" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-family: 'Chivo Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: {{c.dim}}">CARDS</a>
    <a href="#gear" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-family: 'Chivo Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: {{c.dim}}">GEAR</a>
    <a href="#import" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-family: 'Chivo Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: {{c.dim}}">IMPORT</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = {
      ground: '#101112', panel: '#1A1C1E', line: '#2F3337',
      text: '#ECECE8', dim: '#A6AAAE', faint: '#6F7378', led: '#7BD88F',
      tape: '#E7DDC2', tapeInk: '#17181A', marker: '#141517',
      button: '#F2B84B', buttonInk: '#17130A'
    };
    const light = {
      ground: '#D7D7D2', panel: '#E9E9E5', line: '#B9BAB4',
      text: '#151618', dim: '#4C4F53', faint: '#7A7D80', led: '#2E8F47',
      tape: '#F1E8CF', tapeInk: '#17181A', marker: '#141517',
      button: '#F2B84B', buttonInk: '#17130A'
    };
    const c = (this.props.theme ?? 'dark') === 'light' ? light : dark;
    const slot = (kind, tab, text, locked, tilt, cardTilt) => ({
      kind, tab, text, tilt, cardTilt,
      lockedAttr: locked ? 'true' : 'false',
      lockText: locked ? 'KEPT' : 'KEEP',
      lockLabel: (locked ? 'Unlock ' : 'Keep ') + kind.toLowerCase(),
      lockColor: locked ? c.text : c.dim,
      lockBorder: locked ? c.text : c.line
    });
    return {
      c,
      slots: [
        slot('SOURCE', '#86C9A6', 'Gretsch 12-string, tuned down until it rattles.', true, '-2deg', '-0.6deg'),
        slot('TREATMENT', '#F2B84B', 'Pitch Fork+ at minus twelve, wet only.', false, '1.5deg', '0.5deg'),
        slot('CONSTRAINT', '#F08A70', 'Three minutes, then you stop and listen back once.', false, '-1deg', '-0.4deg')
      ]
    };
  }
}
</script>
</body>
</html>
