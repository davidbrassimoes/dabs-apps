<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carta de jogar — draw one</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;600&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.ground}}; color: {{c.text}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 6px">
    <span style="font-weight: 800; font-size: 24px; letter-spacing: -0.02em">sótão</span>
    <div style="display: flex; gap: 4px; border: 1px solid {{c.line}}; border-radius: 999px; padding: 3px">
      <a href="#single" aria-current="page" style="text-decoration: none; padding: 10px 16px; border-radius: 999px; background: {{c.text}}; color: {{c.ground}}; font-weight: 600; font-size: 14px">One</a>
      <a href="#spread" style="text-decoration: none; padding: 10px 16px; border-radius: 999px; color: {{c.dim}}; font-weight: 600; font-size: 14px">Three</a>
    </div>
  </header>

  <div style="padding: 4px 16px 0; display: flex; justify-content: space-between; font-family: 'Azeret Mono', monospace; font-size: 12px; color: {{c.dim}}">
    <a href="#gear" style="text-decoration: none; padding: 12px 0">18 of 42 in the rack</a>
    <span style="padding: 12px 0">3 / 7 tonight</span>
  </div>

  <div style="flex-grow: 1; padding: 6px 22px 0; display: flex">
    <article style="flex-grow: 1; position: relative; border-radius: 20px; background: {{c.card}}; color: {{c.cardInk}}; box-shadow: 0 20px 44px rgba(0,0,0,0.4); padding: 64px 30px 64px; display: flex; flex-direction: column; justify-content: center">
      <div style="position: absolute; top: 16px; left: 18px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{c.suit}}">
        <span style="font-weight: 800; font-size: 26px; line-height: 1">I</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"></circle></svg>
      </div>
      <div style="position: absolute; bottom: 16px; right: 18px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{c.suit}}; transform: rotate(180deg)">
        <span style="font-weight: 800; font-size: 26px; line-height: 1">I</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"></circle></svg>
      </div>
      <button aria-label="Favourite" aria-pressed="false" style="position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 0; background: transparent; color: {{c.cardDim}}; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg>
      </button>
      <span style="font-family: 'Azeret Mono', monospace; font-weight: 600; font-size: 12px; letter-spacing: 0.14em; color: {{c.suit}}; text-align: center">IDEA</span>
      <p style="margin: 14px 0 0; text-align: center; font-weight: 700; font-size: 29px; line-height: 34px; letter-spacing: -0.015em">Play the RD-08 through the Pitch Fork+ at plus one octave, reamp it into the AC30, and mic the amp from the staircase opening.</p>
      <p style="margin: 18px 0 0; text-align: center; font-family: 'Azeret Mono', monospace; font-size: 12px; line-height: 18px; color: {{c.cardDim}}">rd-08 · pitch-fork-plus · ac30 · cm25</p>
    </article>
  </div>

  <div style="padding: 18px 16px 12px; display: flex; gap: 10px">
    <button aria-label="Previous draw" style="width: 64px; height: 76px; border-radius: 20px; border: 1px solid {{c.line}}; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <button style="flex-grow: 1; height: 76px; border-radius: 20px; border: 0; background: {{c.accent}}; color: {{c.accentInk}}; font-weight: 800; font-size: 30px">Draw</button>
  </div>

  <nav aria-label="Sections" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0 8px 10px">
    <a href="#draw" aria-current="page" style="text-decoration: none; text-align: center; padding: 12px 0; font-size: 14px; font-weight: 800; color: {{c.text}}">Draw</a>
    <a href="#cards" style="text-decoration: none; text-align: center; padding: 12px 0; font-size: 14px; font-weight: 600; color: {{c.dim}}">Cards</a>
    <a href="#gear" style="text-decoration: none; text-align: center; padding: 12px 0; font-size: 14px; font-weight: 600; color: {{c.dim}}">Gear</a>
    <a href="#import" style="text-decoration: none; text-align: center; padding: 12px 0; font-size: 14px; font-weight: 600; color: {{c.dim}}">Import</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = {
      ground: '#0E1A17', line: '#2C3B37', text: '#F2EFE8', dim: '#A5B0AC',
      card: '#FBFAF6', cardInk: '#141416', cardDim: '#5F625F', suit: '#141416',
      accent: '#F2EFE8', accentInk: '#0E1A17'
    };
    const light = {
      ground: '#E7E9E4', line: '#BFC5BF', text: '#141416', dim: '#555A57',
      card: '#FFFFFF', cardInk: '#141416', cardDim: '#5F625F', suit: '#141416',
      accent: '#0E1A17', accentInk: '#F2EFE8'
    };
    return { c: (this.props.theme ?? 'dark') === 'light' ? light : dark };
  }
}
</script>
</body>
</html>
