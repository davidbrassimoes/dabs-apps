<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lamparina — draw one</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.ground}}; color: {{c.text}}; font-family: 'Archivo', system-ui, sans-serif; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 10px">
    <span style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 22px; letter-spacing: 0.02em">Sótão</span>
    <div style="display: flex; align-items: center; gap: 6px">
      <a href="#gear" style="text-decoration: none; font-size: 13px; color: {{c.dim}}; border: 1px solid {{c.line}}; border-radius: 999px; padding: 8px 12px; min-height: 20px">In the rack · 18 of 42</a>
      <button aria-label="Settings" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{c.dim}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
      </button>
    </div>
  </header>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 14px">
    <div role="group" aria-label="Mode" style="display: flex; background: {{c.rail}}; border-radius: 10px; padding: 3px">
      <a href="#single" aria-current="page" style="text-decoration: none; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 8px; background: {{c.panel}}; color: {{c.text}}">One card</a>
      <a href="#spread" style="text-decoration: none; font-size: 14px; font-weight: 500; padding: 10px 16px; border-radius: 8px; color: {{c.dim}}">Three</a>
    </div>
    <button style="border: 0; background: transparent; color: {{c.dim}}; font-size: 14px; padding: 10px 4px; min-height: 44px">Filters · none</button>
  </div>

  <div style="flex-grow: 1; padding: 6px 16px 0; display: flex; flex-direction: column">
    <article style="flex-grow: 1; background-color: {{c.paper}}; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 37px, {{c.rule}} 37px, {{c.rule}} 38px); background-position: 0 70px; border-top: 3px solid {{c.margin}}; border-radius: 3px; box-shadow: 0 18px 40px rgba(0,0,0,0.35); padding: 18px 20px 20px; display: flex; flex-direction: column; color: {{c.ink}}">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
        <span style="font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: {{c.kindIdea}}">Idea</span>
        <button aria-label="Favourite" aria-pressed="false" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{c.inkDim}}; display: flex; align-items: center; justify-content: flex-end; padding: 0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg>
        </button>
      </div>
      <p style="margin: 16px 0 0; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 27px; line-height: 38px">Play the RD-08 through the Pitch Fork+ at plus one octave, reamp it into the AC30, and mic the amp from the staircase opening.</p>
      <div style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 16px">
        <span style="font-family: 'Courier Prime', monospace; font-size: 13px; padding: 4px 8px; border: 1px solid {{c.inkLine}}; border-radius: 3px; background: {{c.paper}}">rd-08</span>
        <span style="font-family: 'Courier Prime', monospace; font-size: 13px; padding: 4px 8px; border: 1px solid {{c.inkLine}}; border-radius: 3px; background: {{c.paper}}">pitch-fork-plus</span>
        <span style="font-family: 'Courier Prime', monospace; font-size: 13px; padding: 4px 8px; border: 1px solid {{c.inkLine}}; border-radius: 3px; background: {{c.paper}}">ac30</span>
        <span style="font-family: 'Courier Prime', monospace; font-size: 13px; padding: 4px 8px; border: 1px solid {{c.inkLine}}; border-radius: 3px; background: {{c.paper}}">cm25</span>
      </div>
    </article>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 16px">
    <button aria-label="Previous draw" style="width: 44px; height: 44px; border: 1px solid {{c.line}}; border-radius: 10px; background: transparent; color: {{c.dim}}; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <span style="font-size: 13px; color: {{c.dim}}">3 of 7 tonight</span>
    <button aria-label="Next draw" style="width: 44px; height: 44px; border: 1px solid {{c.line}}; border-radius: 10px; background: transparent; color: {{c.faint}}; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>

  <div style="padding: 0 16px 12px">
    <button style="width: 100%; height: 76px; border: 0; border-radius: 14px; background: {{c.lamp}}; color: {{c.lampInk}}; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 28px; letter-spacing: 0.06em">Draw</button>
  </div>

  <nav aria-label="Sections" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid {{c.line}}; background: {{c.rail}}">
    <a href="#draw" aria-current="page" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-size: 13px; font-weight: 600; color: {{c.text}}">Draw</a>
    <a href="#cards" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-size: 13px; color: {{c.dim}}">Cards</a>
    <a href="#gear" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-size: 13px; color: {{c.dim}}">Gear</a>
    <a href="#import" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-size: 13px; color: {{c.dim}}">Import</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = {
      ground: '#15120F', rail: '#1C1814', panel: '#2A241E', line: '#3A332B',
      text: '#EFE8DC', dim: '#B3A797', faint: '#7F7466',
      paper: '#F3EEE4', ink: '#1E1B18', inkDim: '#6A6158', inkLine: '#CFC6B6',
      rule: '#C9D6E4', margin: '#C2483D', kindIdea: '#1E1B18',
      lamp: '#E3A23F', lampInk: '#1B1307'
    };
    const light = {
      ground: '#E8E2D6', rail: '#DDD6C8', panel: '#FBF9F4', line: '#C8BFAE',
      text: '#1F1B17', dim: '#554C42', faint: '#8A7F70',
      paper: '#FFFFFF', ink: '#1E1B18', inkDim: '#6A6158', inkLine: '#D6CEC0',
      rule: '#D5E0EC', margin: '#C2483D', kindIdea: '#1E1B18',
      lamp: '#8F5410', lampInk: '#FFFFFF'
    };
    return { c: (this.props.theme ?? 'dark') === 'light' ? light : dark };
  }
}
</script>
</body>
</html>
