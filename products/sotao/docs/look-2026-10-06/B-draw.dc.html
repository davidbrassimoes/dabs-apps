<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fita-cola — draw one</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700&amp;family=Chivo+Mono:wght@400;600&amp;family=Permanent+Marker&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.ground}}; color: {{c.text}}; font-family: 'Chivo', system-ui, sans-serif; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px">
    <span style="font-family: 'Permanent Marker', cursive; font-size: 24px; color: {{c.text}}">Sótão</span>
    <a href="#gear" style="text-decoration: none; display: flex; align-items: center; gap: 8px; font-family: 'Chivo Mono', monospace; font-size: 12px; color: {{c.dim}}; padding: 10px 0">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.led}}"></span>RACK 18/42
    </a>
  </header>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 8px 16px 0">
    <a href="#single" aria-current="page" style="text-decoration: none; text-align: center; height: 44px; line-height: 44px; border-radius: 6px; background: {{c.panel}}; border: 1px solid {{c.text}}; font-family: 'Chivo Mono', monospace; font-weight: 600; font-size: 13px; letter-spacing: 0.08em">ONE</a>
    <a href="#spread" style="text-decoration: none; text-align: center; height: 44px; line-height: 44px; border-radius: 6px; background: {{c.panel}}; border: 1px solid {{c.line}}; color: {{c.dim}}; font-family: 'Chivo Mono', monospace; font-size: 13px; letter-spacing: 0.08em">THREE</a>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 10px; gap: 22px">
    <div style="align-self: flex-start; margin-left: 14px; transform: rotate(-2deg); background: {{c.tapeIdea}}; color: {{c.tapeInk}}; font-family: 'Chivo Mono', monospace; font-weight: 600; font-size: 13px; letter-spacing: 0.12em; padding: 7px 14px; clip-path: polygon(0 8%, 4% 0, 96% 6%, 100% 0, 98% 92%, 100% 100%, 3% 95%, 0 100%)">IDEA</div>
    <article style="transform: rotate(-0.8deg); background: {{c.tape}}; color: {{c.marker}}; padding: 26px 26px 28px; clip-path: polygon(0 3%, 2% 0, 6% 2%, 94% 1%, 98% 0, 100% 3%, 99% 50%, 100% 97%, 97% 100%, 4% 99%, 0 100%, 1% 50%); box-shadow: 0 6px 18px rgba(0,0,0,0.35)">
      <p style="margin: 0; font-family: 'Permanent Marker', cursive; font-size: 28px; line-height: 37px">Play the RD-08 through the Pitch Fork+ at plus one octave, reamp it into the AC30, and mic the amp from the staircase opening.</p>
    </article>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 12px">
      <sc-for list="{{gear}}" as="g" hint-placeholder-count="4">
        <span style="transform: rotate({{g.tilt}}); background: {{c.tapeSmall}}; color: {{c.tapeInk}}; font-family: 'Chivo Mono', monospace; font-size: 12px; padding: 5px 9px">{{g.slug}}</span>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 0 16px 12px">
    <button aria-label="Previous draw" style="width: 48px; height: 48px; border-radius: 6px; border: 1px solid {{c.line}}; background: {{c.panel}}; color: {{c.dim}}; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <span style="flex-grow: 1; text-align: center; font-family: 'Chivo Mono', monospace; font-size: 12px; color: {{c.dim}}">3 / 7 TONIGHT</span>
    <button aria-label="Favourite" aria-pressed="false" style="width: 48px; height: 48px; border-radius: 6px; border: 1px solid {{c.line}}; background: {{c.panel}}; color: {{c.dim}}; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg>
    </button>
    <button aria-label="Next draw" style="width: 48px; height: 48px; border-radius: 6px; border: 1px solid {{c.line}}; background: {{c.panel}}; color: {{c.faint}}; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>

  <div style="padding: 0 16px 14px">
    <button style="width: 100%; height: 80px; border: 0; border-radius: 8px; background: {{c.button}}; color: {{c.buttonInk}}; font-family: 'Permanent Marker', cursive; font-size: 32px; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.22)">Draw</button>
  </div>

  <nav aria-label="Sections" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid {{c.line}}; background: {{c.panel}}">
    <a href="#draw" aria-current="page" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-family: 'Chivo Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: {{c.text}}">DRAW</a>
    <a href="#cards" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-family: 'Chivo Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: {{c.dim}}">CARDS</a>
    <a href="#gear" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-family: 'Chivo Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: {{c.dim}}">GEAR</a>
    <a href="#import" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-family: 'Chivo Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: {{c.dim}}">IMPORT</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = {
      ground: '#101112', panel: '#1A1C1E', line: '#2F3337',
      text: '#ECECE8', dim: '#A6AAAE', faint: '#6F7378', led: '#7BD88F',
      tape: '#E7DDC2', tapeSmall: '#D9CEB0', tapeInk: '#17181A', marker: '#141517',
      tapeIdea: '#E7DDC2', button: '#F2B84B', buttonInk: '#17130A'
    };
    const light = {
      ground: '#D7D7D2', panel: '#E9E9E5', line: '#B9BAB4',
      text: '#151618', dim: '#4C4F53', faint: '#7A7D80', led: '#2E8F47',
      tape: '#F1E8CF', tapeSmall: '#E9DEC0', tapeInk: '#17181A', marker: '#141517',
      tapeIdea: '#FFFFFF', button: '#F2B84B', buttonInk: '#17130A'
    };
    const c = (this.props.theme ?? 'dark') === 'light' ? light : dark;
    return {
      c,
      gear: [
        { slug: 'rd-08', tilt: '-2deg' },
        { slug: 'pitch-fork-plus', tilt: '1.5deg' },
        { slug: 'ac30', tilt: '-1deg' },
        { slug: 'cm25', tilt: '2deg' }
      ]
    };
  }
}
</script>
</body>
</html>
