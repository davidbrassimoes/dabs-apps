<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lamparina — cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.85}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.ground}}; color: {{c.text}}; font-family: 'Archivo', system-ui, sans-serif; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 8px">
    <h1 style="margin: 0; font-family: 'Courier Prime', monospace; font-weight: 700; font-size: 26px">Cards <span style="font-weight: 400; font-size: 16px; color: {{c.dim}}">32</span></h1>
    <a href="#new" style="text-decoration: none; display: flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 10px; background: {{c.lamp}}; color: {{c.lampInk}}; font-weight: 600; font-size: 14px">New card</a>
  </header>

  <div style="padding: 8px 16px 0">
    <label for="search-a" style="position: absolute; left: -9999px">Search cards</label>
    <input id="search-a" type="search" placeholder="Search the text" style="width: 100%; box-sizing: border-box; height: 44px; border: 1px solid {{c.line}}; border-radius: 10px; background: {{c.panel}}; color: {{c.text}}; padding: 0 14px; font-size: 15px">
  </div>

  <div style="display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto">
    <sc-for list="{{chips}}" as="k" hint-placeholder-count="5">
      <button aria-pressed="{{k.on}}" style="flex: none; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.fg}}; font-size: 13px; font-weight: 500">{{k.label}}</button>
    </sc-for>
  </div>

  <ul style="list-style: none; margin: 0; padding: 0 16px; flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <li style="background: {{c.panel}}; border: 1px solid {{c.line}}; border-left: 5px solid {{r.color}}; border-radius: 4px; padding: 10px 12px">
        <a href="#edit" style="text-decoration: none; display: block">
          <div style="display: flex; justify-content: space-between; gap: 8px; font-family: 'Courier Prime', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase">
            <span style="color: {{r.color}}">{{r.kinds}}</span>
            <span style="color: {{c.dim}}; letter-spacing: 0.04em">{{r.drawn}}</span>
          </div>
          <p style="margin: 4px 0 0; font-size: 15px; line-height: 21px; color: {{r.textColor}}">{{r.text}}</p>
          <div style="margin-top: 4px; font-family: 'Courier Prime', monospace; font-size: 12px; color: {{c.dim}}">{{r.gear}}</div>
        </a>
      </li>
    </sc-for>
  </ul>

  <nav aria-label="Sections" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid {{c.line}}; background: {{c.rail}}; margin-top: 10px">
    <a href="#draw" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-size: 13px; color: {{c.dim}}">Draw</a>
    <a href="#cards" aria-current="page" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-size: 13px; font-weight: 600; color: {{c.text}}">Cards</a>
    <a href="#gear" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-size: 13px; color: {{c.dim}}">Gear</a>
    <a href="#import" style="text-decoration: none; text-align: center; padding: 14px 0 18px; font-size: 13px; color: {{c.dim}}">Import</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = {
      ground: '#15120F', rail: '#1C1814', panel: '#221D18', line: '#3A332B',
      text: '#EFE8DC', dim: '#B3A797', faint: '#8E8373',
      lamp: '#E3A23F', lampInk: '#1B1307',
      kind: { idea: '#EFE8DC', source: '#6FB3A0', treatment: '#E3A23F', technique: '#9AA8E6', constraint: '#E47B66', arrangement: '#C9A0DA' }
    };
    const light = {
      ground: '#E8E2D6', rail: '#DDD6C8', panel: '#FBF9F4', line: '#D3CAB9',
      text: '#1F1B17', dim: '#5E554A', faint: '#6E6457',
      lamp: '#8F5410', lampInk: '#FFFFFF',
      kind: { idea: '#1F1B17', source: '#2F6E5F', treatment: '#93600F', technique: '#3F4E9A', constraint: '#A93B2A', arrangement: '#74488A' }
    };
    const c = (this.props.theme ?? 'light') === 'dark' ? dark : light;
    const chip = (label, on) => ({
      label, on: on ? 'true' : 'false',
      bg: on ? c.text : 'transparent', fg: on ? c.ground : c.dim, border: on ? c.text : c.line
    });
    const row = (kind, kinds, text, gear, drawn, dimmed) => ({
      color: c.kind[kind], kinds, text, gear, drawn,
      textColor: dimmed ? c.faint : c.text
    });
    return {
      c,
      chips: [chip('All', true), chip('Source', false), chip('Treatment', false), chip('Constraint', false), chip('Favourites', false), chip('Mine', false)],
      rows: [
        row('constraint', 'Constraint', 'Nothing quantised.', 'no gear', 'never drawn', false),
        row('source', 'Source · Technique', 'Melodica, into a microphone — never a DI.', 'melodica · xm8500', 'never drawn', false),
        row('treatment', 'Treatment', 'Hall of Fame 2 before the amp, not after.', 'hall-of-fame-2 · ac30', 'drawn 1×', false),
        row('idea', 'Idea · Technique', 'Play the ocarina and the melodica at the same time, one in each hand, into the CM25.', 'ocarina · melodica · cm25', 'drawn 2×', false),
        row('source', 'Source', 'Kalimba, close-miked, one metre off the slab.', 'kalimba · cm25', 'drawn 3×', false),
        row('arrangement', 'Arrangement', 'Build the whole thing from one bar.', 'no gear', 'drawn 4×', false)
      ]
    };
  }
}
</script>
</body>
</html>
