# CI do workspace. Só verifica: não publica, não assina, não usa segredos. A exceção é o
# mapa-km, que guarda o exe como artefacto da run para ser instalado à mão (SPEC, fatia 10).
#
# Um job por produto, porque cada produto tem a sua toolchain e nenhuma deve correr por
# causa de uma alteração à outra. Ações fixadas por SHA completo, versão em comentário
# (handbook/01-stack.md).
#
# Minutos (handbook/knowledge/ci-minutos-github.md): cada job que arranca paga pelo menos um
# minuto, em Windows dois. Por isso o job `handbook` decide com scripts/changed.sh que
# produtos mudaram, e o job de um produto que não mudou nem arranca (`if` no job, não nos
# passos). O push para main de um merge de PR não corre: a PR já correu.
#
# Para adicionar um produto: copiar o job de exemplo, a sua linha em `outputs` e o seu passo
# `changed.sh` no job `handbook`; trocar o nome, os caminhos e a instalação da toolchain.
# O passo final é sempre `scripts/check <nome>`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # À mão (`gh workflow run ci.yml`): sem commit de base, scripts/changed.sh corre tudo.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  handbook:
    name: Handbook e raiz (CLAUDE.md curto, scripts executáveis)
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gota: ${{ steps.gota.outputs.changed }}
      santa-vibes: ${{ steps.santa-vibes.outputs.changed }}
      sotao: ${{ steps.sotao.outputs.changed }}
      mapa-km: ${{ steps.mapa-km.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Os changed.sh vêm primeiro, para os outputs existirem mesmo que uma verificação falhe.
      - id: gota
        run: scripts/changed.sh products/gota .github scripts
      - id: santa-vibes
        run: scripts/changed.sh products/santa-vibes .github scripts
      - id: sotao
        run: scripts/changed.sh products/sotao .claude/skills/sotao-cards .github scripts
      - id: mapa-km
        run: scripts/changed.sh products/mapa-km .github scripts
      - name: CLAUDE.md da raiz até 80 linhas
        run: |
          n="$(wc -l < CLAUDE.md)"
          echo "CLAUDE.md: $n linhas"
          test "$n" -le 80
      - name: scripts/check de cada produto é executável
        run: |
          fail=0
          for d in products/*/ packages/*/ modules/*/; do
            [ -d "$d" ] || continue
            [ -f "${d}scripts/check" ] || continue
            [ -x "${d}scripts/check" ] || { echo "não executável: ${d}scripts/check"; fail=1; }
          done
          exit "$fail"

  # ---- Exemplo: um produto Android (Gradle). Copiar e adaptar. ----
  # exemplo-android:
  #   name: products/exemplo (Gradle)
  #   needs: handbook
  #   if: ${{ !cancelled() && needs.handbook.outputs.exemplo == 'true' }}
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #         fetch-depth: 0
  #     - uses: actions/setup-java@<SHA> # vX
  #       with: { distribution: temurin, java-version: '21' }
  #     - uses: gradle/actions/setup-gradle@<SHA> # vX
  #     - run: scripts/check exemplo

  gota:
    name: products/gota (Gradle, testes unitários e lint)
    needs: handbook
    if: ${{ !cancelled() && needs.handbook.outputs.gota == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: scripts/check gota

  santa-vibes:
    name: products/santa-vibes (tv-app core tests, authoring check, signals-core and phone native tests)
    needs: handbook
    if: ${{ !cancelled() && needs.handbook.outputs.santa-vibes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: products/santa-vibes/authoring/package-lock.json
      - run: npm ci --silent
        working-directory: products/santa-vibes/authoring
      - run: scripts/check santa-vibes

  sotao:
    name: products/sotao (SvelteKit, check, lint, testes e build para Workers)
    needs: handbook
    if: ${{ !cancelled() && needs.handbook.outputs.sotao == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: products/sotao/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: products/sotao
      - run: scripts/check sotao

  mapa-km:
    name: products/mapa-km (.NET 10, WinForms, build, format, testes e exe)
    needs: handbook
    if: ${{ !cancelled() && needs.handbook.outputs.mapa-km == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: products/mapa-km/global.json
      - run: scripts/check mapa-km
      - run: products/mapa-km/scripts/publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapa-km-win-x64
          path: products/mapa-km/dist/
          if-no-files-found: error
          retention-days: 30
