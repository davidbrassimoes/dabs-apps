# As ações de CI são o único ecossistema da raiz. Cada produto acrescenta o seu
# (gradle, npm, cargo, nuget) com `directory` apontado à sua pasta, e lista em `ignore`
# qualquer dependência que mude de termos de licença numa versão futura
# (handbook/obrigacoes.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /products/gota
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /products/santa-vibes/tv-app
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /products/santa-vibes/authoring
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
